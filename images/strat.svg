<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="pickguard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e5e7eb" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="#1e293b"/>
  <!-- Neck -->
  <rect x="185" y="40" width="30" height="240" fill="#d97706" rx="4" />
  <!-- Headstock -->
  <path d="M 185 40 Q 170 15 200 10 Q 225 15 215 40 Z" fill="#b45309" />
  <!-- Body -->
  <path d="M 140 200 Q 110 240 130 310 Q 150 370 200 370 Q 250 370 270 310 Q 290 240 260 200 Q 230 180 200 210 Q 170 180 140 200 Z" fill="url(#bodyGrad)" stroke="#7f1d1d" stroke-width="4"/>
  <!-- Pickguard -->
  <path d="M 160 230 Q 140 260 160 320 Q 200 340 240 320 Q 250 270 230 240 Z" fill="url(#pickguard)" />
  <!-- Pickups -->
  <rect x="180" y="240" width="40" height="8" rx="3" fill="#1f2937" />
  <rect x="180" y="260" width="40" height="8" rx="3" fill="#1f2937" />
  <rect x="180" y="280" width="40" height="8" rx="3" fill="#1f2937" />
  <!-- Knobs -->
  <circle cx="225" cy="300" r="7" fill="#ffffff" stroke="#9ca3af" />
  <circle cx="215" cy="320" r="7" fill="#ffffff" stroke="#9ca3af" />
</svg>
